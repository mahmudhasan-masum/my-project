
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Version 2</title>
<link href="/src/style.css" rel="stylesheet">
   
</head>

<body class="min-h-screen bg-slate-100 p-5">

    <!-- Main Container -->
    <div class="mx-auto mt-10 max-w-2xl rounded-2xl bg-white p-6 shadow-lg sm:p-8">

        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800">
                My Todo App
            </h1>

            <p class="mt-2 text-slate-500">
                Organize your daily tasks
            </p>
        </div>

        <!-- Add Task Form -->
        <form id="main-form" class="mb-4 flex flex-col gap-3 sm:flex-row">

            <input
                id="input-form"
                type="text"
                placeholder="Enter your task..."
                class="min-w-0 flex-1 rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            >

            <button
                id="submit-btn"
                type="submit"
                class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700"
            >
                Add Task
            </button>

        </form>

        <!-- Error Message -->
        <p id="eroormsg" class="mb-4 hidden text-sm text-red-500">
            Please enter a task!
        </p>

        

        <!-- Task Header -->
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-800">
                My Tasks
            </h2>

            <span class="rounded-full bg-blue-100 px-4 py-2 text-sm font-semibold text-blue-700">
                Total: <span id="count">0</span>
            </span>
        </div>

        <!-- Task List -->
        <div id="task-list" class="space-y-3">

            <!-- Example Task 1 -->
            
            

        </div>

        <!-- Empty Message -->
        <p class="mt-6 hidden text-center text-slate-400">
            No tasks found!
        </p>

        <!-- Clear All Button -->
        <div class="mt-6 border-t border-slate-200 pt-5 text-right">
            <button
                id="clear-btn"
                type="button"
                class="rounded-xl bg-red-600 px-5 py-3 font-semibold text-white transition hover:bg-red-700"
            >
                Clear All
            </button>
        </div>

    </div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
